{% extends "base.html" %}
{% block title %}{{ '프로젝트 수정' if project else '새 프로젝트' }}{% endblock %}
{% block content %}
<div class="container" style="padding-top:6rem; max-width:640px;">
  <h2>{{ '프로젝트 수정' if project else '새 프로젝트 추가' }}</h2>
  <form method="POST" style="margin-top:2rem;">
    <div class="form-group">
      <label>제목 *</label>
      <input type="text" name="title" value="{{ project.title if project else '' }}" required />
    </div>
    <div class="form-group">
      <label>설명 *</label>
      <textarea name="description" rows="4" required>{{ project.description if project else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>기술 스택 (쉼표로 구분)</label>
      <input type="text" name="tech_stack" placeholder="Python, Flask, SQLite" value="{{ project.tech_stack if project else '' }}" />
    </div>
    <div class="form-group">
      <label>기간</label>
      <input type="text" name="period" placeholder="2024.03 – 2024.06" value="{{ project.period if project else '' }}" />
    </div>
    <div class="form-group">
      <label>GitHub URL</label>
      <input type="url" name="github_url" value="{{ project.github_url if project else '' }}" />
    </div>
    <div class="form-group">
      <label>Demo URL</label>
      <input type="url" name="demo_url" value="{{ project.demo_url if project else '' }}" />
    </div>
    <div class="form-group">
      <label>정렬 순서 (숫자가 낮을수록 먼저 표시)</label>
      <input type="number" name="order" value="{{ project.order if project else 0 }}" />
    </div>
    <div style="display:flex; gap:1rem; margin-top:2rem;">
      <button type="submit" class="btn btn-primary">저장</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">취소</a>
    </div>
  </form>
</div>
{% endblock %}
