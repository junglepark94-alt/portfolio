{% extends "base.html" %}
{% block title %}{{ '갤러리 수정' if item else '갤러리 추가' }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />

<div class="container" style="padding-top:6rem; max-width:640px;">
  <h2>{{ '갤러리 항목 수정' if item else '갤러리 항목 추가' }}</h2>

  <form method="POST" enctype="multipart/form-data" style="margin-top:2rem;" id="galleryForm">
    <input type="hidden" name="cropped_data" id="croppedData" />

    <div class="form-group">
      <label>제목 *</label>
      <input type="text" name="title" value="{{ item.title if item else '' }}" required />
    </div>

    <div class="en-section">
      <div class="en-section-title">
        <span class="en-badge">ENG</span> 영문 정보
        <button type="button" class="translate-btn" data-src="title" data-target="title_en">✦ AI 번역</button>
      </div>
      <div class="form-group">
        <label>Title (English)</label>
        <input type="text" name="title_en" id="title_en" value="{{ item.title_en if item and item.title_en else '' }}" placeholder="Gallery item title in English" />
      </div>
    </div>

    <!-- 이미지 업로드 & 크롭 -->
    <div class="form-group">
      <label>이미지 {% if not item %}*{% endif %}</label>

      {% if item %}
      <div class="img-preview-wrap" style="margin-bottom:0.75rem;">
        <img src="{{ url_for('static', filename='uploads/' + item.image_filename) }}"
             class="img-preview" alt="현재 이미지" />
        <span style="font-size:0.8rem; color:var(--muted);">새 이미지를 선택하면 교체됩니다.</span>
      </div>
      {% endif %}

      <div class="gallery-crop-zone" id="cropZone" style="display:none;">
        <div class="crop-wrap" style="max-height:360px; background:#111; overflow:hidden;">
          <img id="cropTarget" src="" alt="" style="display:block; max-width:100%;" />
        </div>
        <div style="display:flex; gap:0.75rem; padding:0.75rem 0;">
          <button type="button" id="applyCropBtn" class="btn btn-primary">크롭 적용</button>
          <button type="button" id="skipCropBtn" class="btn btn-ghost">크롭 없이 사용</button>
        </div>
      </div>

      <div id="cropPreviewWrap" style="display:none; margin-bottom:0.75rem;">
        <img id="cropPreview" src="" alt=""
             style="width:220px; height:165px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--border);" />
        <div style="margin-top:0.4rem; font-size:0.78rem; color:var(--accent);">✓ 크롭 완료</div>
      </div>

      <input type="file" id="fileInput" name="image" accept="image/*" style="margin-top:0.25rem;" />
      <small style="color:var(--muted); display:block; margin-top:0.3rem;">PNG, JPG, WEBP 등 최대 5MB · 4:3 비율로 크롭됩니다</small>
    </div>

    <div class="form-group">
      <label>정렬 순서 (숫자가 낮을수록 먼저 표시)</label>
      <input type="number" name="sort_order" value="{{ item.sort_order if item else 0 }}" />
    </div>

    <div style="display:flex; gap:1rem; margin-top:2rem;">
      <button type="submit" class="btn btn-primary">저장</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">취소</a>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
(function () {
  const fileInput  = document.getElementById('fileInput');
  const cropTarget = document.getElementById('cropTarget');
  const cropZone   = document.getElementById('cropZone');
  const previewWrap = document.getElementById('cropPreviewWrap');
  const previewImg  = document.getElementById('cropPreview');
  const croppedData = document.getElementById('croppedData');
  let cropper = null;

  fileInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    cropTarget.src = url;
    cropZone.style.display = '';
    previewWrap.style.display = 'none';
    croppedData.value = '';
    cropTarget.onload = () => {
      if (cropper) { cropper.destroy(); }
      cropper = new Cropper(cropTarget, { aspectRatio: 4/3, viewMode: 1, autoCropArea: 0.9 });
    };
  });

  document.getElementById('applyCropBtn').addEventListener('click', function () {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 900 });
    croppedData.value = canvas.toDataURL('image/jpeg', 0.88);
    previewImg.src = croppedData.value;
    previewWrap.style.display = '';
    cropZone.style.display = 'none';
    // 크롭 완료 시 파일 input 초기화 (서버가 cropped_data 사용)
    fileInput.value = '';
  });

  document.getElementById('skipCropBtn').addEventListener('click', function () {
    cropZone.style.display = 'none';
    croppedData.value = '';
  });

  document.getElementById('galleryForm').addEventListener('submit', function (e) {
    if (cropZone.style.display !== 'none' && !croppedData.value) {
      e.preventDefault();
      alert('크롭을 적용하거나 "크롭 없이 사용"을 눌러주세요.');
    }
  });
})();
</script>
{% endblock %}
